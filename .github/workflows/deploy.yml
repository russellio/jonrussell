name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to deploy: a branch like origin/main, or a commit SHA (for rollback)"
        required: false
        default: origin/main

# Never run two production deploys at once, and never cancel one mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/tests.yml

  # The deploy droplet has ~1GB RAM, most of it already spoken for by Apache/MySQL/queue
  # workers at idle -- `pnpm run build:ssr` reliably OOMs there. Build here instead, where
  # RAM is never the constraint, and ship the runner's finished output to the server.
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Pushes the release commit + tag back to main.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          REF="${{ github.event.inputs.ref || 'origin/main' }}"
          # actions/checkout wants a bare branch/tag/SHA, not a remote-tracking ref.
          echo "ref=${REF#origin/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          # Full history + tags, so the version step can diff against the last release.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Must precede setup-node so `cache: 'pnpm'` can find the pnpm binary.
      # Version comes from package.json "packageManager" — single source of truth.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # Normal deploys (main) mint a new semver from Conventional Commits since the last
      # tag: `!:`/BREAKING CHANGE -> major, feat -> minor, anything else -> patch.
      # A pinned-SHA rollback reuses whatever tag that commit already shipped under --
      # minting a new, higher version for old code would mislabel it in Sentry.
      - name: Compute release version
        id: version
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "main" ]; then
            echo "version=$(git describe --tags HEAD)" >> "$GITHUB_OUTPUT"
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Old tags are inconsistently prefixed (v1.0.2 vs 1.1.0) -- compare on the bare number.
          LATEST_TAG=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | awk '{ v = $0; sub(/^v/, "", v); print v, $0 }' | sort -V -k1,1 | tail -n1 | cut -d' ' -f2 || true)
          if [ -z "$LATEST_TAG" ]; then
            RANGE=HEAD; MAJOR=0; MINOR=0; PATCH=0
          else
            RANGE="$LATEST_TAG..HEAD"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
          fi
          LOG=$(git log --format='%s%n%b' "$RANGE")
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<< "$LOG"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$LOG"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          echo "version=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "should_tag=true" >> "$GITHUB_OUTPUT"

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      # @laravel/vite-plugin-wayfinder shells out to `artisan wayfinder:generate`
      # during `vite build`, so the app needs to be bootable (same reason lint.yml
      # does this before its own build) even though this vendor/.env never ships.
      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build client + SSR bundles
        env:
          # Public, non-secret values baked into the client bundle at build time --
          # must match prod's .env exactly, or Turnstile/branding break silently.
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ steps.version.outputs.version }}
        run: pnpm run build:ssr

      - name: Package built assets
        run: tar -czf release-assets.tar.gz public/build bootstrap/ssr

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets.tar.gz
          retention-days: 1

      # After the build, so a broken bundle never burns a version number. [skip ci]
      # keeps the release commit from re-triggering this workflow.
      - name: Bump version, tag, and push
        if: steps.version.outputs.should_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm pkg set version="${VERSION#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${VERSION} [skip ci]"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin HEAD:main --follow-tags

  deploy:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Prepare release on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref || 'origin/main' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_REF
          script_stop: true # abort on the first command that fails
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # No trap here on purpose: if composer/migrate fails, the site should stay
            # visibly in maintenance (503) rather than silently reopen on broken state --
            # that silent-reopen is exactly what masked the SSR build OOM as a live 500.
            php artisan down --retry=15 || true
            git fetch --all --prune
            git reset --hard "${DEPLOY_REF}"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force

      - name: Upload built assets to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "release-assets.tar.gz"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Finalize deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: RELEASE_VERSION
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Only bring the site back up if SSR passes its health check below --
            # otherwise leave it in maintenance and let the non-zero exit fail the
            # deploy loudly. An unconditional `php artisan up` here would silently
            # reopen the site on a dead SSR backend, which is exactly the failure
            # mode the down step above already guards against on its side.
            ssr_ok=0
            trap 'rc=$?; if [ "$ssr_ok" -eq 1 ]; then php artisan up || true; fi; exit $rc' EXIT
            # Gitignored, so git reset --hard never clears these. Wiped so the
            # extracted tarball lands clean instead of merging with stale hashed assets.
            rm -rf public/build bootstrap/ssr
            tar -xzf release-assets.tar.gz
            rm -f release-assets.tar.gz
            # config/sentry.php reads SENTRY_RELEASE; the optimize below re-caches it.
            if grep -q '^SENTRY_RELEASE=' .env; then
              sed -i "s/^SENTRY_RELEASE=.*/SENTRY_RELEASE=${RELEASE_VERSION}/" .env
            else
              echo "SENTRY_RELEASE=${RELEASE_VERSION}" >> .env
            fi
            php artisan optimize:clear
            php artisan optimize
            php artisan filament:optimize
            sudo systemctl restart inertia-ssr
            # The unit is Type=simple, so systemctl returns as soon as systemd forks
            # -- artisan still has to boot Laravel and spawn node before anything
            # binds :13714. Poll rather than racing that startup.
            for _ in $(seq 1 15); do
              if php artisan inertia:check-ssr; then
                ssr_ok=1
                break
              fi
              sleep 2
            done
            if [ "$ssr_ok" -ne 1 ]; then
              echo "Inertia SSR did not become healthy within 30s -- failing the deploy."
              journalctl -u inertia-ssr -n 50 --no-pager || true
              exit 1
            fi
            php artisan queue:restart
