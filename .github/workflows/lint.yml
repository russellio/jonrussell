name: linter

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_call: # allows deploy.yml to reuse this as a gate

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      # Check-mode only: these must FAIL on violations so the deploy gate is real.
      - name: Run Pint (check)
        run: vendor/bin/pint --test

      - name: Check formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npx eslint .

      - name: Type-check
        run: npx vue-tsc --noEmit
