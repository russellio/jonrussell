name: linter

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_call: # allows deploy.yml to reuse this as a gate

# Cancel superseded runs on PRs only. The guard matters: when deploy.yml invokes this
# via workflow_call the called workflow's own concurrency key applies, but the `github`
# context resolves to the *caller's*. An unconditional cancel-in-progress would
# therefore let a later push to main cancel the lint gate of an in-flight production
# deploy.
#
# The prefix is a literal, not `github.workflow`, for the same reason: under
# workflow_call that expression yields "deploy" here *and* in tests.yml, so the two
# gates collided on one group and -- with cancel-in-progress false on that path --
# serialized instead of running in parallel, adding ~70s to every deploy.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      # Must precede setup-node so `cache: 'pnpm'` can find the pnpm binary.
      # Version comes from package.json "packageManager" — single source of truth.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node major comes from .nvmrc — single source of truth, shared with local dev and
      # read the same way by tests.yml, deploy.yml, and the russellio.com /
      # lawnwriter.com repos.
      #
      # This is allowed to lead production's node, but only after checking. ssr.noExternal
      # in vite.config.ts bundles every dependency into bootstrap/ssr, and the droplet
      # executes that bundle under its own /usr/bin/node (v22.23.1 on 2026-10-15), so a
      # build on a newer major could in principle emit syntax prod cannot parse. That
      # failure is invisible from the outside — Inertia's SSR server answers 200 with a
      # zero-byte body when a render throws, which is why deploy.yml gates on
      # inertia:verify-render rather than a status code.
      #
      # So before raising this past prod's major: build :ssr on the new major, then
      # `node --check` every bootstrap/ssr chunk and run `pnpm test:ssr` under prod's
      # major. 26 was cleared that way on 2026-10-15 (node 26.10.0 build; clean --check
      # and passing render smoke test on 22.22.3) — Vite's SSR output is ES2020-era
      # because the bundled deps ship for broad compat, so the two majors are not in
      # practice coupled.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      # The build is a prerequisite for the type-check, not a duplicate of tests.yml:
      # `auto-imports.d.ts` and `components.d.ts` are gitignored and emitted by the
      # Nuxt UI Vite plugin, and Wayfinder emits resources/js/{actions,routes}. Without
      # a build first, vue-tsc fails on every auto-imported symbol. Wayfinder shells out
      # to artisan, so the app must be bootable.
      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: pnpm run build

      # Check-mode only: these must FAIL on violations so the deploy gate is real.
      - name: Run Pint (check)
        run: vendor/bin/pint --test

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint Frontend
        run: pnpm exec eslint .

      - name: Type-check
        run: pnpm exec vue-tsc --noEmit
