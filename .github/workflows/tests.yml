name: tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_call: # allows deploy.yml to reuse this as a gate

# Cancel superseded runs on PRs only -- see the same block in lint.yml for why the
# event_name guard is load-bearing for the deploy path, and why the group prefix is a
# literal rather than `github.workflow`.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer:v2
          # Nothing in this pipeline collects coverage: pest runs without --coverage
          # and phpunit.xml's <source> element is empty. Loading Xdebug just to
          # discard its output taxes every line the suite executes.
          coverage: none

      # Must precede setup-node so `cache: 'pnpm'` can find the pnpm binary.
      # Version comes from package.json "packageManager" — single source of truth.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # build:ssr rather than build: the SSR bundle is what the render smoke test
      # below and the `ssr` Pest group execute. Without it both skip or fail, and
      # a bundle that cannot render would reach production unnoticed -- the
      # /health check the deploy used to rely on never calls render at all.
      - name: Build Assets
        run: pnpm run build:ssr

      # Boots the built bundle and renders the committed fixtures, asserting a
      # real body comes back and the server logged nothing to stderr. Inertia's
      # SSR server answers 200 with a zero-byte body when a render throws, so
      # neither a status code nor a health check can catch this.
      - name: SSR render smoke test
        run: pnpm test:ssr

      - name: Tests
        run: ./vendor/bin/pest
